<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Release Notes — Genova IPTV</title>
  <meta name="description" content="Official production release notes for Genova IPTV on Android and Android TV." />
  <link rel="icon" type="image/svg+xml" href="../assets/genova-logo.svg" />
  <link rel="canonical" href="https://mainthreadapps.com/genovaiptv/releases/" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink-50: #090A0F;
      --ink-100: #101218;
      --ink-300: #16181D;
      --ink-400: #272A35;
      --paper-0: #F2F4F8;
      --azure-400: #4C8DF6;
      --azure-500: #6B9FE8;
      --success: #58C27A;
      --text-secondary: rgba(255, 255, 255, 0.68);
      --glass: rgba(255, 255, 255, 0.10);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--ink-50);
      color: var(--paper-0);
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(9, 10, 15, 0.86);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--ink-400);
    }
    .header-inner {
      max-width: 820px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--paper-0);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
    }
    .back-link:hover { color: var(--azure-500); }
    .locale-switcher {
      display: inline-flex;
      gap: 4px;
      padding: 3px;
      border-radius: 999px;
      background: var(--ink-100);
      border: 1px solid var(--ink-400);
    }
    .locale-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      padding: 5px 12px;
      border-radius: 999px;
      font-family: 'Geist Mono', ui-monospace, monospace;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
    }
    .locale-btn.active {
      background: var(--azure-400);
      color: #FFFFFF;
    }
    main {
      max-width: 820px;
      margin: 0 auto;
      padding: 48px 20px 80px;
    }
    .page-kicker {
      font-family: 'Geist Mono', ui-monospace, monospace;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--azure-500);
      margin-bottom: 8px;
    }
    h1 {
      font-size: clamp(1.9rem, 4vw, 2.6rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
    }
    .lead {
      color: var(--text-secondary);
      margin-bottom: 36px;
      font-size: 1rem;
    }
    .release-list {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .release-card {
      background: var(--ink-300);
      border: 1px solid var(--ink-400);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35), inset 0 1px 0 var(--glass);
    }
    .release-card.is-latest { border-color: rgba(107, 159, 232, 0.45); }
    .release-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--ink-400);
    }
    .release-version-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .release-version {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.01em;
    }
    .badge-latest {
      font-family: 'Geist Mono', ui-monospace, monospace;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(88, 194, 122, 0.16);
      color: var(--success);
      border: 1px solid rgba(88, 194, 122, 0.35);
      text-transform: uppercase;
    }
    .release-date {
      font-family: 'Geist Mono', ui-monospace, monospace;
      font-size: 0.82rem;
      color: var(--text-secondary);
    }
    .release-group + .release-group { margin-top: 18px; }
    .release-group h3 {
      font-size: 0.82rem;
      font-family: 'Geist Mono', ui-monospace, monospace;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--azure-500);
      margin-bottom: 8px;
    }
    .release-group ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .release-group li {
      position: relative;
      padding-left: 18px;
      color: rgba(242, 244, 248, 0.9);
      font-size: 0.95rem;
    }
    .release-group li::before {
      content: "•";
      position: absolute;
      left: 2px;
      color: var(--azure-500);
      font-weight: 800;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="back-link" href="../">
        <span>&larr;</span>
        <span data-i18n="back">Genova IPTV</span>
      </a>
      <div class="locale-switcher" role="group" aria-label="Language">
        <button type="button" class="locale-btn" data-lang="en">EN</button>
        <button type="button" class="locale-btn" data-lang="fr">FR</button>
      </div>
    </div>
  </header>
  <main>
    <p class="page-kicker" data-i18n="kicker">Production Releases</p>
    <h1 data-i18n="title">Release Notes</h1>
    <p class="lead" data-i18n="lead">
      What’s new in each production release of Genova IPTV on Google Play (Android &amp; Android TV).
    </p>
    <div class="release-list" id="release-list"></div>
  </main>
  <script>
    const UI = {
      en: {
        pageTitle: 'Release Notes — Genova IPTV',
        back: 'Back to Genova IPTV',
        kicker: 'Production Releases',
        title: 'Release Notes',
        lead: 'What’s new in each production release of Genova IPTV on Google Play (Android & Android TV).',
        latest: 'Current Production',
        groups: { new: 'New', improvements: 'Improvements', fixes: 'Fixes', changes: 'Changes' }
      },
      fr: {
        pageTitle: 'Notes de version — Genova IPTV',
        back: 'Retour à Genova IPTV',
        kicker: 'Versions en production',
        title: 'Notes de version',
        lead: 'Les nouveautés et améliorations de chaque version en production de Genova IPTV sur Google Play (Android & Android TV).',
        latest: 'En production',
        groups: { new: 'Nouveau', improvements: 'Améliorations', fixes: 'Corrections', changes: 'Changements' }
      }
    };

    const RELEASES = [
  {
    "version": "0.19.0",
    "date": "2026-11-12",
    "latest": true,
    "en": {
      "improvements": [
        "Your favourite channels now appear on Home.",
        "Start your trial once your provider is set up.",
        "Choose hardware decoding in the settings.",
        "Side panels fill the screen, and Back closes them.",
        "Live loads faster and zapping is steadier."
      ],
      "fixes": [
        "The Watched filter now applies correctly.",
        "Failed streams retry with another player.",
        "More audio formats now play."
      ]
    },
    "fr": {
      "improvements": [
        "Vos chaînes favorites apparaissent sur l'Accueil.",
        "Démarrez votre essai une fois votre fournisseur configuré.",
        "Choisissez le décodage matériel dans les réglages.",
        "Les panneaux latéraux occupent l'écran, et Retour les ferme.",
        "Le Live se charge plus vite et le zapping est plus stable."
      ],
      "fixes": [
        "Le filtre Vus s'applique correctement.",
        "Les flux en échec sont relancés avec un autre lecteur.",
        "Plus de formats audio sont lus."
      ]
    }
  },
  {
    "version": "0.16.31",
    "date": "2026-10-26",
    "latest": false,
    "en": {
      "improvements": [
        "Redesigned movie details with tabs, suggestions and an expandable synopsis.",
        "Redesigned player with unified sheets, landscape controls and info blocks.",
        "The episode list shows every season.",
        "New subscription screen with a Subscribe button per plan and the annual plan highlighted."
      ],
      "fixes": [
        "Premium access is recognised correctly.",
        "The Live favourite icon responds faster.",
        "Smoother tab indicator and ripples."
      ]
    },
    "fr": {
      "improvements": [
        "Fiche film repensée avec onglets, suggestions et synopsis à déplier.",
        "Lecteur repensé : feuilles unifiées, commandes en paysage et blocs d'infos.",
        "La liste d'épisodes affiche toutes les saisons.",
        "Nouvel écran d'abonnement avec un bouton S'abonner par formule et la formule annuelle mise en avant."
      ],
      "fixes": [
        "L'accès Premium est reconnu correctement.",
        "L'icône favori du Live réagit plus vite.",
        "Indicateur d'onglet et effets de toucher plus fluides."
      ]
    }
  },
  {
    "version": "0.16.24",
    "date": "2026-10-18",
    "latest": false,
    "en": {
      "new": [
        "\"Continue watching\" rails for movies and series.",
        "Faster catalog sync."
      ],
      "fixes": [
        "Rotating the screen no longer interrupts playback on phones.",
        "The guide, details or episodes stay in place under the video.",
        "Closing the picture-in-picture window now stops playback."
      ]
    },
    "fr": {
      "new": [
        "Rails « Reprendre » pour les films et les séries.",
        "Synchronisation du catalogue plus rapide."
      ],
      "fixes": [
        "La rotation de l'écran ne coupe plus la lecture sur téléphone.",
        "Sous la vidéo, l'EPG, le détail ou les épisodes restent affichés.",
        "Fermer la fenêtre en incrustation arrête bien la lecture."
      ]
    }
  }
];

    function resolveLocale() {
      const urlLang = new URLSearchParams(window.location.search).get('lang');
      if (urlLang && UI[urlLang]) return urlLang;
      try {
        const saved = localStorage.getItem('genova_lang');
        if (saved && UI[saved]) return saved;
      } catch (_) {}
      return (navigator.language || 'en').toLowerCase().startsWith('fr') ? 'fr' : 'en';
    }

    function escapeHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function render(lang) {
      const ui = UI[lang] || UI.en;
      document.documentElement.lang = lang;
      document.title = ui.pageTitle;
      document.querySelectorAll('[data-i18n]').forEach((el) => {
        const key = el.getAttribute('data-i18n');
        if (ui[key]) el.textContent = ui[key];
      });
      document.querySelectorAll('.locale-btn').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });
      const list = document.getElementById('release-list');
      list.innerHTML = '';
      RELEASES.forEach((rel) => {
        const content = rel[lang] || rel.en;
        const card = document.createElement('article');
        card.className = 'release-card' + (rel.latest ? ' is-latest' : '');
        const groupsHtml = Object.keys(content).map((groupKey) => {
          const items = content[groupKey].map((item) => `<li>${escapeHtml(item)}</li>`).join('');
          return `<div class="release-group"><h3>${ui.groups[groupKey] || groupKey}</h3><ul>${items}</ul></div>`;
        }).join('');
        card.innerHTML = `
          <div class="release-head">
            <div class="release-version-wrap">
              <h2 class="release-version">v${rel.version}</h2>
              ${rel.latest ? `<span class="badge-latest">${ui.latest}</span>` : ''}
            </div>
            ${rel.date ? `<time class="release-date" datetime="${rel.date}">${rel.date}</time>` : ''}
          </div>
          ${groupsHtml}
        `;
        list.appendChild(card);
      });
      try { localStorage.setItem('genova_lang', lang); } catch (_) {}
    }

    document.querySelectorAll('.locale-btn').forEach((btn) => {
      btn.addEventListener('click', () => render(btn.dataset.lang));
    });
    render(resolveLocale());
  </script>
</body>
</html>
